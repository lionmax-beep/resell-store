<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Product | Lion Store</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#07090c;--card:#11151b;--line:#252b34;--text:#f6f7f8;--muted:#969da8;--green:#9cff3b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}
.nav{height:72px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:#07090cee;backdrop-filter:blur(12px)}
.logo{font-size:25px;font-weight:800}.logo span,.tag{color:var(--green)}nav{display:flex;gap:28px;color:#c4c9d0;font-size:14px}.cartBtn{background:var(--green);border:0;border-radius:10px;padding:10px 14px}.cartBtn b{background:#111;color:#fff;border-radius:15px;padding:2px 6px}
.hero{min-height:580px;padding:70px 9%;display:grid;grid-template-columns:1fr .8fr;align-items:center;gap:60px;background:radial-gradient(circle at 78% 35%,#25351b,transparent 32%)}
.tag{font-size:11px;letter-spacing:2px;font-weight:800}h1{font-size:clamp(55px,8vw,92px);line-height:.95;letter-spacing:-5px;margin:15px 0}h1 span{color:var(--green)}.sub{max-width:520px;color:var(--muted);font-size:17px;line-height:1.7;margin-bottom:28px}
.btn{display:inline-block;background:var(--green);color:#10130c;padding:14px 20px;border-radius:10px;font-weight:800;border:0;cursor:pointer}
.heroVisual{min-height:370px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#181e25,#0d1014);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 25px 70px #0008}.heroVisual div{font-size:150px}.heroVisual small{color:var(--green);margin-top:10px}.heroVisual strong{font-size:24px;margin-top:6px}
.section{padding:75px 9%}h2{font-size:36px;margin:4px 0 28px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.cats button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:23px;text-align:left;font-size:28px}.cats button:hover{border-color:var(--green)}.cats b,.cats small{display:block}.cats b{font-size:16px;margin-top:10px}.cats small{font-size:12px;color:var(--muted);margin-top:3px}
.topline{display:flex;justify-content:space-between;align-items:end;gap:20px}.topline input{width:280px;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px 14px;outline:0}.topline input:focus{border-color:var(--green)}
.filters{display:flex;gap:8px;margin-bottom:25px}.filters button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:9px 14px;border-radius:8px}.filters .active,.filters button:hover{background:var(--green);color:#111;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px)}.pic{height:200px;background:#171b22;display:grid;place-items:center;font-size:85px}.info{padding:16px}.info small{color:var(--green);font-weight:700}.info h3{margin:6px 0}.price{font-weight:800;font-size:19px}.old{font-size:12px;color:#6d737c;text-decoration:line-through;margin-left:5px}.add{width:100%;padding:10px;border:0;border-radius:8px;background:#20252e;color:#fff;margin-top:14px;font-weight:700}.add:hover{background:var(--green);color:#111}
.contact{margin:20px 9% 70px;padding:35px;border:1px solid var(--line);border-radius:20px;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:20px}.contact p:not(.tag){color:var(--muted)}.whatsapp{background:#25d366;color:#071008;padding:13px 18px;border-radius:10px;font-weight:800;white-space:nowrap}
footer{border-top:1px solid var(--line);padding:30px 9%;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.cart{position:fixed;right:-430px;top:0;width:min(430px,100%);height:100vh;background:#0c0f13;z-index:30;border-left:1px solid var(--line);padding:24px;display:flex;flex-direction:column;transition:.3s}.cart.open{right:0}.cartHead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.cartHead button{background:none;color:#fff;border:0;font-size:20px}.cartItem{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line)}.cartItem small{color:var(--muted)}.remove{background:none;color:#ff7777;border:0}.cartBottom{border-top:1px solid var(--line);padding-top:18px;margin-top:auto}.cartBottom>div{display:flex;justify-content:space-between;margin-bottom:14px}.full{width:100%;text-align:center}.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:20}.overlay.show{display:block}.empty,.notfound{text-align:center;color:var(--muted);padding:40px}.notfound{grid-column:1/-1}
@media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){nav{display:none}.nav{padding:0 5%}.hero,.section{padding-left:5%;padding-right:5%}.hero{padding-top:55px}.grid{grid-template-columns:1fr}.topline{align-items:stretch;flex-direction:column}.topline input{width:100%}.contact{margin-left:5%;margin-right:5%;flex-direction:column;align-items:flex-start}.contact .whatsapp{width:100%;text-align:center}footer{padding:28px 5%;flex-direction:column;gap:8px}}
.status{margin:0 0 18px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:13px}.status.ok{border-color:#355d18;color:var(--green)}
.admin{background:#0a0d11}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.panel h3{margin-top:0}.panel label{display:block;font-size:12px;color:var(--muted);margin:12px 0}.panel input,.panel select{width:100%;margin-top:6px;background:#0b0f14;color:#fff;border:1px solid var(--line);border-radius:8px;padding:11px}.panel small{color:var(--muted)}.dataList{margin-top:14px}.dataRow{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0}.dataRow span{display:flex;align-items:center;gap:9px}.dataRow small{display:block;color:var(--muted);font-size:11px}.dataRow img,.pic img{object-fit:contain}.dataRow img{width:38px;height:38px}.pic{overflow:hidden}.pic img{width:100%;height:100%}
@media(max-width:700px){.adminGrid{grid-template-columns:1fr}}

.page{max-width:1100px;margin:0 auto;padding:48px 6% 80px}
.adminNav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
.adminNav a,.back{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
.adminNav a.primary,.btn{background:var(--green);color:#071006;border-color:var(--green)}
.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
.stat{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.stat b{display:block;font-size:30px;margin-top:8px}
.panel{padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--card);margin:18px 0}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
form label{display:block;margin:12px 0;color:var(--muted);font-size:14px}
form input,form select,form textarea{width:100%;margin-top:7px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0b0f14;color:var(--text);outline:none}
form input:focus,form select:focus{border-color:var(--green)}
.full{width:100%;margin-top:15px}
.dataRow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.dataRow:last-child{border-bottom:0}
.dataRow small{display:block;color:var(--muted);margin-top:4px}
.remove{background:transparent;border:1px solid #5b2730;color:#ff8c98;padding:9px 13px;border-radius:10px}
.notice{padding:13px 15px;border:1px solid var(--line);border-radius:12px;color:var(--muted);margin:15px 0}
@media(max-width:700px){.statGrid,.formGrid{grid-template-columns:1fr}.page{padding-top:30px}.nav{padding:0 5%}.nav nav{display:none}}
</style></head><body>
<header class="nav"><a class="logo" href="index.html">Lion <span>Store</span></a>
<nav><a href="index.html">Store</a><a href="admin.html">Admin</a></nav>
<a class="back" href="admin.html">← Admin</a></header>
<main class="page">
<p class="tag">PRODUCT MANAGEMENT</p><h1>Add Product</h1>
<p class="sub">Add a product directly to your Firebase database.</p>
<div class="panel"><form id="productForm">
<div class="formGrid">
<label>Product name<input id="productName" required placeholder="e.g. Galaxy A16 5G"></label>
<label>Category<select id="productCategory"><option>Phones</option><option>Gadgets</option><option>Fashion</option></select></label>
<label>Sale price<input id="productPrice" type="number" min="0" required placeholder="59000"></label>
<label>Old price<input id="productOldPrice" type="number" min="0" placeholder="65000"></label>
<label>Product icon<input id="productIcon" maxlength="8" placeholder="📱"></label>
<label>Image URL <small>(optional)</small><input id="productImage" type="url" placeholder="https://..."></label>
<label>Stock<input id="productStock" type="number" min="0" value="1"></label>
</div>
<button class="btn full" type="submit">Save Product</button>
</form><div id="msg" class="notice">Ready.</div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyDy2Ljwj7hg1tsopcC39gvhngxwnVorNtU",
 authDomain:"lion-store-f2c4a.firebaseapp.com",
 projectId:"lion-store-f2c4a",
 storageBucket:"lion-store-f2c4a.firebasestorage.app",
 messagingSenderId:"37752415149",
 appId:"1:37752415149:web:83fb03e7265db23e00f724",
 measurementId:"G-S3SDFPPS5K"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
function money(n){return "Rs. "+Number(n||0).toLocaleString("en-LK");}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
</script>
<script>document.getElementById("productForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const msg=document.getElementById("msg");
 const p={
  n:document.getElementById("productName").value.trim(),
  c:document.getElementById("productCategory").value,
  p:Number(document.getElementById("productPrice").value),
  o:Number(document.getElementById("productOldPrice").value)||0,
  i:document.getElementById("productIcon").value.trim()||"🛍️",
  img:document.getElementById("productImage").value.trim(),
  stock:Number(document.getElementById("productStock").value)||0,
  createdAt:Date.now()
 };
 try{await db.ref("products").push(p); e.target.reset(); document.getElementById("productStock").value=1; msg.textContent="✅ Product saved successfully."; }
 catch(err){msg.textContent="❌ Could not save: "+err.message;}
});</script></body></html>
