<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com https://www.google.com; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self';"><title>Add Product | Lion Store</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><a class="logo" href="index.html">Lion <span>Store</span></a><nav><a href="index.html">Home</a><a href="products.html">Products</a></nav><a class="back" href="admin.html">← Admin</a></header><main class="page"><p class="tag">PRODUCT MANAGEMENT</p><h1>Add Product</h1><p class="sub">Add a product directly to your Firebase database.</p><div id="denied" class="panel hidden"><h2>Access denied</h2><p class="sub">Your admin account does not have permission to manage products.</p><a class="btn" href="admin.html">Back to Admin</a></div><div id="formBox" class="panel hidden"><form id="productForm"><div class="formGrid"><label>Product name<input id="productName" required placeholder="e.g. Galaxy A16 5G"></label><label>Category<select id="productCategory"></select></label><label>Sale price<input id="productPrice" type="number" min="0" required placeholder="59000"></label><label>Old price<input id="productOldPrice" type="number" min="0" placeholder="65000"></label><label>Product icon<input id="productIcon" maxlength="8" placeholder="📱"></label><label>Image URL <small>(optional)</small><input id="productImage" type="url" placeholder="https://..."></label><label>Stock<input id="productStock" type="number" min="0" value="1"></label></div><button class="btn full" type="submit">Save Product</button></form><div id="msg" class="notice">Ready.</div></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase.js"></script><script src="auth.js"></script><script>
requireAdmin().then(async a=>{if(!a)return;if(!can('manageProducts')){denied.classList.remove('hidden');return}formBox.classList.remove('hidden');let cats=defaultCategories;const s=await db.ref('settings/categories').once('value');if(s.exists())cats=Object.entries(s.val()).map(([id,v])=>({id,...v})).filter(x=>x.enabled!==false);productCategory.innerHTML=cats.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');});
productForm.addEventListener('submit',async e=>{e.preventDefault();if(!can('manageProducts'))return;const name=productName.value.trim(),price=Number(productPrice.value),oldPrice=Number(productOldPrice.value)||0,stock=Number(productStock.value)||0;if(!name){msg.textContent='❌ Product name is required.';return}if(!(price>=0)||!(stock>=0)||!(oldPrice>=0)){msg.textContent='❌ Price and stock cannot be negative.';return}const p={n:name,c:productCategory.value,p:price,o:oldPrice,i:productIcon.value.trim()||'🛍️',img:productImage.value.trim(),stock:stock,createdAt:Date.now(),createdBy:currentAdmin.uid};try{await db.ref('products').push(p);e.target.reset();productStock.value=1;msg.textContent='✅ Product saved successfully.'}catch(err){msg.textContent='❌ '+err.message}});
</script></body></html>
