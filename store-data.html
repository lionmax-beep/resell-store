<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lion Store | Store Data</title><link rel="stylesheet" href="styles.css">
</head><body>
<header class="nav"><a class="logo" href="index.html">Lion <span>Store</span></a><a href="admin.html">← Admin</a></header>
<main class="container" style="max-width:900px;margin:30px auto;padding:16px">
<h1>Store Data</h1><p>Manage basic store information saved in Firebase.</p>
<section class="card">
<label>Store Name</label><input id="storeName" placeholder="Lion Store">
<label>Phone</label><input id="storePhone" placeholder="+94...">
<label>Address</label><textarea id="storeAddress"></textarea>
<label>Post Code</label><input id="storePostCode">
<label>WhatsApp</label><input id="storeWhatsapp" placeholder="+94...">
<div style="margin-top:15px"><button id="save" class="btn">Save Store Data</button></div>
<p id="status"></p>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase.js"></script><script src="auth.js"></script>
<script>
const ids=['storeName','storePhone','storeAddress','storePostCode','storeWhatsapp'];
function load(){db.ref('settings/storeData').once('value').then(s=>{const d=s.val()||{};ids.forEach(k=>document.getElementById(k).value=d[k]||'')}).catch(e=>status('Could not load store data.',false))}
function status(t,ok=true){const x=document.getElementById('status');x.textContent=t;x.style.color=ok?'#72df9b':'#ff7777'}
document.getElementById('save').onclick=async()=>{
 const user=firebase.auth().currentUser;if(!user){location.href='admin.html';return}
 const d={};ids.forEach(k=>d[k]=document.getElementById(k).value.trim());
 try{await db.ref('settings/storeData').update(d);status('Store data saved.')}catch(e){status('Save failed. Check admin permission and Firebase rules.',false)}
};
firebase.auth().onAuthStateChanged(u=>{if(u)load();else location.href='admin.html'});
</script></body></html>
